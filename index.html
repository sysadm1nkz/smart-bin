<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Автоматическая умная мусорка</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.4/dist/teachablemachine-image.min.js"></script>
<style>body{font-family:Arial;background:#eef7f3;margin:0;padding:18px;color:#17342c}main{max-width:520px;margin:auto;background:white;padding:20px;border-radius:24px}h1{color:#126b50}#camera{aspect-ratio:1;background:#dcebe5;border-radius:18px;overflow:hidden;display:grid;place-items:center}canvas{width:100%;height:100%;object-fit:cover}button{width:100%;padding:15px;margin:14px 0;border:0;border-radius:14px;background:#126b50;color:white;font-size:17px;font-weight:bold}.status{padding:11px;background:#f1f6f4;border-radius:12px;margin:8px 0}.row{display:grid;grid-template-columns:90px 1fr 50px;gap:8px;margin:9px 0}.bar{height:12px;background:#ddd;border-radius:9px;overflow:hidden}.fill{height:100%;background:#21a477}#result{text-align:center;font-size:23px;font-weight:bold;color:#126b50}</style></head>
<body><main><h1>♻️ Умная мусорка</h1><div id="camera">Подготовка…</div><button id="start" disabled>Первый запуск системы</button><div id="status" class="status">Загрузка модели…</div><div id="sensor" class="status">Датчик: ожидание ESP32</div><div id="pred"></div><p id="result">Ожидание предмета</p></main>
<script>
const SERVICE='7b8e0001-6b4b-4f6d-9d9d-1c9a6d730001',COMMAND='7b8e0002-6b4b-4f6d-9d9d-1c9a6d730001',THRESHOLD=.80;
let model,webcam,device,ch,predictions=[],scanning=false;
const q=x=>document.getElementById(x),sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function load(){try{model=await tmImage.load('./model.json','./metadata.json');q('status').textContent='Модель готова';q('start').disabled=false;restore()}catch(e){q('status').textContent='Ошибка модели: '+e.message}}
async function camera(){if(webcam)return;webcam=new tmImage.Webcam(224,224,true);await webcam.setup({facingMode:'environment'});await webcam.play();q('camera').replaceChildren(webcam.canvas);loop()}
async function loop(){if(!webcam)return;webcam.update();predictions=await model.predict(webcam.canvas);q('pred').innerHTML=predictions.map(p=>{let n=Math.round(p.probability*100);return `<div class="row"><span>${p.className}</span><div class="bar"><div class="fill" style="width:${n}%"></div></div><b>${n}%</b></div>`}).join('');requestAnimationFrame(loop)}
async function connect(d){device=d;const server=await d.gatt.connect(),service=await server.getPrimaryService(SERVICE);ch=await service.getCharacteristic(COMMAND);await ch.startNotifications();ch.addEventListener('characteristicvaluechanged',message);q('sensor').textContent='Датчик: ожидает предмет'}
async function start(){try{q('start').disabled=true;let d=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'SmartBin'}],optionalServices:[SERVICE]});await connect(d);await camera();q('start').hidden=true;q('status').textContent='Система работает автоматически'}catch(e){q('status').textContent='Ошибка: '+e.message;q('start').disabled=false}}
async function restore(){if(!navigator.bluetooth?.getDevices)return;try{let ds=await navigator.bluetooth.getDevices(),d=ds.find(x=>x.name?.startsWith('SmartBin'));if(d){await connect(d);await camera();q('start').hidden=true;q('status').textContent='Автоматическое подключение выполнено'}}catch(e){}}
async function message(e){let m=new TextDecoder().decode(e.target.value);if(m==='SCAN'&&!scanning)classify();if(m==='READY'){q('sensor').textContent='Датчик: ожидает предмет';q('result').textContent='Ожидание предмета'}}
async function classify(){if(!ch||!webcam)return;scanning=true;q('sensor').textContent='Предмет обнаружен';q('result').textContent='Распознавание…';let sums={Plastic:0,Paper:0,Other:0};for(let i=0;i<12;i++){for(const p of predictions)if(p.className in sums)sums[p.className]+=p.probability;await sleep(90)}let a=Object.entries(sums).map(([name,sum])=>({name,p:sum/12})).sort((x,y)=>y.p-x.p),cmd='OTHER',label='Другое';if(a[0]?.p>=THRESHOLD&&a[0].name==='Plastic'){cmd='PLASTIC';label='Пластик'}else if(a[0]?.p>=THRESHOLD&&a[0].name==='Paper'){cmd='PAPER';label='Бумага'}await ch.writeValue(new TextEncoder().encode(cmd));q('result').textContent=label+' → команда отправлена';q('sensor').textContent='Механизм работает';scanning=false}
q('start').onclick=start;load();
</script></body></html>
